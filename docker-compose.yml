services:

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      # test: ["CMD", "mysqladmin", "ping", "-h", "13.124.197.2"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: nimoot/mongddang-backend:2.0
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
  
  # fastapi:
  #   build:
  #     context: ./backend/ai/fast-api  # Dockerfile이 위치한 디렉토리 경로
  #     dockerfile: Dockerfile # Dockerfile의 이름 (변경 필요 없음)
  #   container_name: fastapi-app
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - .env
  #   environment:
  #     DB_HOST: db
  #     DB_PORT: 3306
  #     DB_USER: ${MYSQL_USER}
  #     DB_PASSWORD: ${MYSQL_PASSWORD}
  #     DB_NAME: ${MYSQL_DATABASE}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - app-network

  frontend:
    image: nimoot/mongddang-frontend:2.0
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - app-network
  # nginx:
  #   # image: nginx:latest
  #   build: 
  #     context: .
  #   ports:
  #     - "80:80"
  #   # volumes:
  #   #   - /mnt/c/Users/SSAFY/Desktop/dev/S12P11B209/nginx.conf:/etc/nginx/nginx.conf
  #   #   - ./frontend/mongddang/dist:/usr/share/nginx/html
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - /mnt/c/Users/SSAFY/Desktop/dev/S12P11B209/nginx.conf/etc/nginx/nginx.conf
      - ./frontend/mongddang/dist:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge