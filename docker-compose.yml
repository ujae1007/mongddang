services:

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mongddang
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
      MYSQL_ROOT_PASSWORD: ssafy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/mongddang?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=ssafy
      - SPRING_DATASOURCE_PASSWORD=ssafy
      - AWS_ACCESS_KEY_ID=AKIA6D6JBDATSWEM6N5I
      - AWS_SECRET_ACCESS_KEY=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
      - AWS_DEFAULT_REGION=us-east-1
      - S3_BUCKET_NAME=nimoot
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mysql_data:/var/lib/mysql
    #   - ~/.aws:root/.aws:ro

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  mysql_data:  

networks:
  app-network:
    driver: bridge