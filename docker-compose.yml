services:
  # Frontend: Vue
  frontend:
    image: node:16
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8081:8080"
    command: /bin/sh -c "npm install && npm run serve"
    # command: tail -f /dev/null
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  # Backend: Spring Boot
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    # image: openjdk:17
    # working_dir: /app/backend-java
    # volumes:
    #   - ./backend-java:/app/backend-java # host:docker
    ports:
      - "8080:8080"
    # command: ./mvnw spring-boot:run
    # command: tail -f /dev/nullf
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/mydb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: example
    depends_on:
      - db
    # restart: always

  # Database: MariaDB
  db:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db-data:
