spring.application.name=backend

#file size(추후 결정 시 변경)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

#dataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mongddang?serverTimezone=UTC
spring.datasource.username=REMOVED
spring.datasource.password=REMOVED

#mybatis-config
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.mongddang.backend.user.dto
mybatis.configuration.map-underscore-to-camel-case=true 


#JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jwt.secret=REMOVED
spring.jwt.expiration=3600000


#파일 저장소 설정 
# 기본 프로필 이미지 URL
default.profile.image.url=http://localhost:8080/images/default-profile.png
file.storage.location=C:/Users/SSAFY/Desktop/uploads

# 정적 리소스 설정
spring.mvc.static-path-pattern=/images/**
spring.web.resources.static-locations=file:./uploads/