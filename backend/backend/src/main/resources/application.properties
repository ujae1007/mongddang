spring.application.name=backend

#file size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# AWS S3 설정
cloud.aws.s3.bucketName=REMOVED-mongddang
cloud.aws.credentials.access-key=REMOVED
cloud.aws.credentials.secret-key=REMOVED
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false


#dataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/mongddang?serverTimezone=UTC
spring.datasource.username=REMOVED
spring.datasource.password=REMOVED

#mybatis-config
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.mongddang.backend.user.dto,com.mongddang.backend.email.dto,com.mongddang.backend.follow.dto,com.mongddang.backend.comment.dto,com.mongddang.backend.jwt.dto
mybatis.configuration.map-underscore-to-camel-case=true 


#JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT
spring.jwt.secret=REMOVED
# access 1시간
spring.jwt.access-expiration=3600000 
# refresh 24시간
spring.jwt.refresh-expiration=86400000

#redis
spring.redis.host=localhost
spring.redis.port=6379

#파일 저장소 설정 
# 기본 프로필 이미지 URL
default.profile.image.url=https://REMOVED-mongddang.s3.ap-northeast-2.amazonaws.com/profile/default-profile.png


# email 인증
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REMOVED  
spring.mail.password=REMOVED  
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
