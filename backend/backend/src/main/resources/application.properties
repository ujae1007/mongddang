# .env 파일을 Spring Boot 설정 파일로 추가
spring.config.import=optional:classpath:application-env.properties

spring.application.name=backend


spring.devtools.restart.enabled=false

# file size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# AWS S3 설정 (환경 변수 적용)
cloud.aws.s3.bucketName=${S3_BUCKET_NAME}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_DEFAULT_REGION}
cloud.aws.stack.auto=false

# 데이터베이스 설정 (환경 변수 적용)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# MyBatis 설정
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.mongddang.backend.user.dto,com.mongddang.backend.email.dto,com.mongddang.backend.follow.dto,com.mongddang.backend.comment.dto,com.mongddang.backend.jwt.dto,com.mongddang.backend.profile.dto,com.mongddang.backend.like.dto
mybatis.configuration.map-underscore-to-camel-case=true 

# JPA 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT (환경 변수 적용)
spring.jwt.secret=${JWT_SECRET_KEY}
spring.jwt.access-expiration=3600000  
spring.jwt.refresh-expiration=86400000

# Redis 설정
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}


# 파일 저장소 기본 프로필 이미지 URL
default.profile.image.url=${PROFILE_IMAGE_URL}

# 이메일 인증 (환경 변수 적용)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
